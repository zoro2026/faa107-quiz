<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAA Part 107 Quiz — Practice for the 2026 Chart Changes</title>
<meta name="description" content="Free FAA Part 107 practice quiz. Image-based sectional chart questions plus 567 knowledge questions with explanations. Prepare before the Oct 26, 2026 change.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2530;--line:#2b3542;
  --fg:#e8eef5;--dim:#8b98a8;--acc:#3fb950;--acc2:#2f81f7;
  --bad:#f85149;--warn:#d29922;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
h1{font-size:22px;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.btn{display:block;width:100%;padding:15px 16px;border:0;border-radius:12px;font-size:16px;font-weight:600;
  cursor:pointer;margin:8px 0 0;text-align:center;color:#fff;background:var(--acc2);font-family:inherit}
.btn.g{background:var(--acc)}.btn.d{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn:active{transform:scale(.985)}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin:8px 0 0;
  background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--fg);font-size:15.5px;
  cursor:pointer;font-family:inherit;line-height:1.4}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;background:#2b3542;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;margin-top:1px}
.opt.ok{border-color:var(--acc);background:rgba(63,185,80,.13)}
.opt.ok .k{background:var(--acc)}
.opt.no{border-color:var(--bad);background:rgba(248,81,73,.12)}
.opt.no .k{background:var(--bad)}
.opt[disabled]{cursor:default;opacity:.95}
.bar{height:6px;background:#222b36;border-radius:99px;overflow:hidden;margin:0 0 14px}
.bar>i{display:block;height:100%;background:var(--acc2);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin:0 0 8px}
.q{font-size:17px;font-weight:600;margin:2px 0 12px;line-height:1.42}
.chart{width:100%;border-radius:10px;border:1px solid var(--line);margin:0 0 12px;cursor:zoom-in;background:#000}
.exp{margin:12px 0 0;padding:12px 13px;border-left:3px solid var(--warn);background:rgba(210,153,34,.1);
  border-radius:0 9px 9px 0;font-size:14.5px;color:#dfe6ee}
.exp b{color:var(--warn);display:block;margin:0 0 4px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:40px;font-weight:800;margin:6px 0 2px;letter-spacing:-.03em}
.center{text-align:center}
.cta{background:linear-gradient(135deg,#1f6feb22,#3fb95022);border:1px solid #2f81f755}
.cta h2{margin:0 0 6px}
.cta p{margin:0 0 12px;font-size:14px;color:var(--dim)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99;display:none;overflow:auto}
.zoom.on{display:block}
.zoom img{width:220%;max-width:none;display:block;margin:8px 0}
.zoom .x{position:fixed;top:10px;right:12px;background:#222b36;color:#fff;border:0;border-radius:10px;
  padding:9px 14px;font-size:15px;font-weight:600;z-index:100}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin:10px 0 0}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--card2);
  color:var(--dim);border:1px solid var(--line);margin:0 4px 6px 0}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:22px;line-height:1.6}
a{color:var(--acc2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="zoom" id="zoom"><button class="x" id="zx">✕ Close</button><img id="zimg" alt="chart"></div>

<script>
const QUIZ_URL = 'questions.json';
const CTA = {
  chart: 'https://payhip.com/b/yvibz',
  bank: 'https://payhip.com/b/703iw'
};
let ALL = [], Q = [], i = 0, score = 0, wrong = [], answered = false, mode = '';

const app = document.getElementById('app');
const $ = (h) => { app.innerHTML = h; window.scrollTo(0, 0); };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const store = {
  get best() { return +(localStorage.getItem('p107_best') || 0); },
  set best(v) { localStorage.setItem('p107_best', v); },
  get seen() { try { return JSON.parse(localStorage.getItem('p107_seen') || '[]'); } catch(e) { return []; } },
  addSeen(id) { const s = this.seen; if (!s.includes(id)) { s.push(id); localStorage.setItem('p107_seen', JSON.stringify(s.slice(-4000))); } }
};

function shuffle(a) { for (let n = a.length - 1; n > 0; n--) { const j = Math.floor(Math.random() * (n + 1));[a[n], a[j]] = [a[j], a[n]]; } return a; }

async function load() {
  try {
    const r = await fetch(QUIZ_URL, { cache: 'force-cache' });
    ALL = await r.json();
  } catch (e) {
    $('<div class="card"><h2>Could not load questions</h2><p class="sub">Please check your connection and reload.</p></div>');
    return;
  }
  home();
}

function home() {
  const chart = ALL.filter(q => q.image).length;
  const total = ALL.length;
  $(`<h1>FAA Part 107 Quiz</h1>
  <p class="sub">Free practice questions with instant explanations.<br>
  <b style="color:#d29922">New from Oct 26, 2026:</b> the real exam adds chart images that are <b>not</b> in the printed testing supplement.</p>
  <div class="card">
    <h2>Choose a mode</h2>
    <span class="pill">${total} questions total</span><span class="pill">${chart} with charts</span>
    ${store.best ? `<span class="pill">Best ${store.best}%</span>` : ''}
    <button class="btn g" onclick="start('chart')">Chart Practice<small>${chart} image-based sectional chart questions</small></button>
    <button class="btn" onclick="start('quick')">Quick 10<small>Mixed random questions — 2 minutes</small></button>
    <button class="btn d" onclick="start('all')">Full Test<small>25 mixed questions</small></button>
  </div>
  <div class="card cta">
    <h2>From Oct 26, 2026 the exam adds chart-image questions</h2>
    <p>The FAA says the Part 107 test will include image-based questions that are <b>not in the printed test supplement</b>. This quiz is a free sample. The paid sets give you every question with a full explanation.</p>
    <a class="btn g" href="${CTA.chart}" target="_blank" rel="noopener">The Oct 26 Chart Drill — 30 questions · $9.99 →</a>
    <a class="btn d" href="${CTA.bank}" target="_blank" rel="noopener">Complete Bundle — 567 questions + charts · $19.99 →</a>
  </div>
  <footer>Unofficial study aid. Not affiliated with or endorsed by the FAA.<br>
  Always verify current information at faa.gov.</footer>`);
}

function start(m) {
  mode = m;
  if (m === 'chart') Q = shuffle(ALL.filter(q => q.image).slice());
  else if (m === 'quick') Q = shuffle(ALL.slice()).slice(0, 10);
  else Q = shuffle(ALL.slice()).slice(0, 25);
  i = 0; score = 0; wrong = [];
  question();
}

function question() {
  if (i >= Q.length) return result();
  answered = false;
  const q = Q[i];
  const pct = Math.round((i / Q.length) * 100);
  const img = q.image ? `<img class="chart" src="${q.image}" alt="Sectional chart excerpt" loading="lazy" onclick="zoom('${q.image}')">` : '';
  $(`<div class="bar"><i style="width:${pct}%"></i></div>
  <div class="meta"><span>Question ${i + 1} of ${Q.length}</span><span>Score ${score}</span></div>
  ${img}
  <div class="q">${esc(q.question)}</div>
  <div id="opts">${q.options.map(o =>
    `<button class="opt" data-k="${o.k}" onclick="pick(this,'${o.k}')"><span class="k">${o.k}</span><span>${esc(o.t)}</span></button>`
  ).join('')}</div>
  <div id="fb"></div>
  ${q.image ? '<p class="hint">Tap the chart to zoom in</p>' : ''}`);
}

function pick(el, k) {
  if (answered) return;
  answered = true;
  const q = Q[i];
  const ok = k === q.answer;
  if (ok) score++;
  else wrong.push({ q: q, picked: k });
  store.addSeen(q.id);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.answer) b.classList.add('ok');
    else if (b.dataset.k === k) b.classList.add('no');
  });
  document.getElementById('fb').innerHTML =
    `<div class="exp"><b>${ok ? '✓ Correct' : '✗ Not quite — answer is ' + q.answer}</b>${esc(q.explanation || 'No explanation available.')}</div>
     <button class="btn g" onclick="next()">${i + 1 >= Q.length ? 'See results' : 'Next question'} →</button>`;
}

function next() { i++; question(); }

function result() {
  const pct = Q.length ? Math.round((score / Q.length) * 100) : 0;
  if (pct > store.best) store.best = pct;
  const msg = pct >= 90 ? 'Excellent — exam ready!' : pct >= 70 ? 'Passing range. Keep going.' : 'Keep practising — review the misses below.';
  const misses = wrong.slice(0, 8).map(w =>
    `<div class="exp"><b>${esc(w.q.id)} · you picked ${w.picked}, answer ${w.q.answer}</b>${esc((w.q.question || '').slice(0, 150))}</div>`
  ).join('');
  $(`<div class="card center">
    <div class="big">${pct}%</div>
    <p class="sub">${score} of ${Q.length} correct · ${msg}</p>
    <button class="btn g" onclick="start('${mode}')">Try again</button>
    <button class="btn d" onclick="shareResult(${pct},${score},${Q.length})">Share my score</button>
    <button class="btn d" onclick="home()">Change mode</button>
  </div>
  ${wrong.length ? `<div class="card"><h2>Review your misses (${wrong.length})</h2>${misses}</div>` : ''}
  <div class="card cta">
    <h2>Want all 30 chart questions?</h2>
    <p>Every one of the 30 image-based chart questions, with the chart printed above the question and a full explanation for each answer — plus a printable cheat sheet and the 2-page Oct 26 briefing.</p>
    <a class="btn g" href="${CTA.chart}" target="_blank" rel="noopener">The Oct 26 Chart Drill — $9.99 →</a>
    <a class="btn d" href="${CTA.bank}" target="_blank" rel="noopener">Or the Complete Bundle (567 Q) — $19.99 →</a>
  </div>
  <footer>Unofficial study aid. Not affiliated with or endorsed by the FAA.</footer>`);
}

function shareResult(pct, s, n) {
  const txt = `I scored ${pct}% (${s}/${n}) on the FAA Part 107 practice quiz — the exam changes on Oct 26, 2026. Try it:`;
  const url = location.href;
  if (navigator.share) navigator.share({ title: 'FAA Part 107 Quiz', text: txt, url }).catch(() => {});
  else { navigator.clipboard.writeText(txt + ' ' + url); alert('Score copied — paste it anywhere!'); }
}

function zoom(src) {
  document.getElementById('zimg').src = src;
  document.getElementById('zoom').classList.add('on');
}
document.getElementById('zx').onclick = () => document.getElementById('zoom').classList.remove('on');
load();
</script>
</body>
</html>
